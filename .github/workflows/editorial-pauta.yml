name: Pauta editorial semanal

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  pauta:
    runs-on: ubuntu-latest
    steps:
      - name: Abrir issue de pauta
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            const title = `Pauta técnica semanal - ${date}`;
            const body = [
              "Checklist editorial para conteúdos da Conexium Engenharia:",
              "",
              "- [ ] Tema técnico definido",
              "- [ ] Categoria selecionada: Engenharia e Projetos Elétricos, Consultoria Técnico-Regulatória ou Perícias e Pareceres Técnicos",
              "- [ ] Fontes primárias normativas listadas (ABNT, ANEEL, PRODIST)",
              "- [ ] Afirmações técnicas e regulatórias revisadas por engenheiro habilitado",
              "- [ ] Status inicial em Markdown como `draft` ou `review`",
              "- [ ] Publicar apenas após validação formal (`published`)",
              "",
              "Sugestões de pauta técnica:",
              "- Auditoria de parecer de acesso e contestação técnica fundamentada",
              "- Estudos elétricos de curto-circuito e coordenação de proteção",
              "- Quesitos técnicos e assistência pericial no setor elétrico",
              "- Dimensionamento de subestações e adequações de demanda"
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["conteudo", "pauta"]
            });
